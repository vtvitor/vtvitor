<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitor Quest · Mini Game</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090f1e;color:#dcecff;font-family:system-ui,Arial;display:flex;align-items:center;justify-content:center;padding:20px}main{width:min(900px,100%);text-align:center}h1{font-size:clamp(2rem,6vw,4rem);margin:.1em 0;color:#65e4cc;letter-spacing:3px}p{color:#abbfd9}canvas{display:block;width:100%;image-rendering:pixelated;background:#10213a;border:3px solid #375b7b;border-radius:12px;touch-action:manipulation}button{background:#59dec8;color:#071322;font-weight:900;border:0;border-radius:9px;padding:14px 28px;cursor:pointer;margin:14px;letter-spacing:1px}small{display:block;color:#8ba4c3}button:focus-visible{outline:3px solid white}</style>
</head><body><main><h1>VITOR QUEST</h1><p>Desvie dos bugs e colete pontos. Espaço, ↑ ou toque para pular.</p><canvas id="g" width="840" height="320" aria-label="Jogo de pular obstáculos e coletar moedas"></canvas><button id="start">▶ JOGAR / REINICIAR</button><small>Feito com JavaScript puro · Mobile e desktop · A cada ponto, um bug a menos 🐛</small></main>
<script>
const c=document.getElementById('g'),ctx=c.getContext('2d'),btn=document.getElementById('start');let game,raf,last=0;
function reset(){game={run:true,dead:false,score:0,coins:0,t:0,speed:4.2,y:0,vy:0,obs:[],next:50};last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
function jump(){if(!game?.run){reset();return}if(game.y===0)game.vy= -12.5}
btn.addEventListener('click',reset);c.addEventListener('pointerdown',jump);document.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump()}});
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.floor(x),Math.floor(y),w,h)}
function tick(ts){if(!game.run)return;let dt=Math.min((ts-last)/16.67||1,2);last=ts;game.t+=dt;const g=game;g.speed=Math.min(8,g.speed+.0015*dt);g.vy+=.63*dt;g.y=Math.max(0,g.y+g.vy*dt);if(g.y===0)g.vy=0;
g.next-=dt;if(g.next<0){let coin=Math.random()<.42;g.obs.push({x:850,type:coin?'coin':'bug',taken:false});g.next=48+Math.random()*40}
g.obs.forEach(o=>{o.x-=g.speed*dt;const overlap=o.x<125&&o.x+27>85;if(overlap&&!o.taken){if(o.type==='bug'&&g.y<38){g.dead=true;g.run=false}else if(o.type==='coin'&&g.y>25&&g.y<130){o.taken=true;g.coins++;g.score+=50}}});g.obs=g.obs.filter(o=>o.x>-40&&!o.taken);g.score+=dt*.15;
draw();if(g.run)raf=requestAnimationFrame(tick)}
function draw(){const g=game;ctx.fillStyle='#101e35';ctx.fillRect(0,0,840,320);for(let i=0;i<65;i++){let x=(i*157+21)%840,y=(i*79+12)%190;rect(x,y,2,2,'#385873')}
for(let i=0;i<22;i++){let h=20+(i*37)%72;rect(i*42,258-h,35,h,'#192d47')}rect(0,258,840,62,'#193a42');rect(0,253,840,6,'#62dfc4');for(let i=0;i<26;i++)rect(i*38,276,19,3,'#305861');
const x=80,y=174-g.y;rect(x+5,y,36,13,'#263347');rect(x+2,y+13,42,31,'#eab48e');rect(x+10,y+21,9,5,'#152439');rect(x+30,y+21,9,5,'#152439');rect(x,y+44,47,45,'#2f9dd1');rect(x+19,y+49,8,24,'#62dfc4');rect(x+2,y+88,19,17,'#172a48');rect(x+26,y+88,19,17,'#172a48');
g.obs.forEach(o=>{if(o.type==='bug'){rect(o.x,226,26,27,'#f0788a');rect(o.x+5,235,5,5,'#1b2840');rect(o.x+18,235,5,5,'#1b2840')}else{rect(o.x,185,24,24,'#ffd66c');rect(o.x+9,188,5,18,'#bd8539')}});
ctx.font='bold 20px monospace';ctx.fillStyle='#e1f0ff';ctx.fillText('VITOR QUEST',24,34);ctx.fillText('SCORE '+Math.floor(g.score).toString().padStart(5,'0'),505,34);ctx.fillStyle='#ffdb75';ctx.fillText('★ '+g.coins,744,34);
if(g.dead){rect(185,85,470,127,'#101b31');ctx.strokeStyle='#5bdcc7';ctx.strokeRect(185,85,470,127);ctx.textAlign='center';ctx.fillStyle='#ff9ca5';ctx.font='bold 31px monospace';ctx.fillText('GAME OVER',420,139);ctx.font='17px monospace';ctx.fillStyle='#e0eafd';ctx.fillText('Clique em JOGAR para tentar de novo',420,174);ctx.textAlign='left'}}
game={run:false,dead:false,score:0,coins:0,y:0,obs:[]};draw();</script></body></html>
